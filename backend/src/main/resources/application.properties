spring.application.name=hotel-manager

# ---- PostgreSQL datasource ----
# Create the database first, e.g.:  createdb hotel_manager
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_manager
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from the entities (handy for dev).
# Switch to 'validate' + Flyway/Liquibase migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
